<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Popcorn coming out of the clapperboard -->
    <g fill="#ffde00" stroke="#f59e0b" stroke-width="4" stroke-linejoin="round">
        <!-- Floating popcorns -->
        <!-- Popcorn 1 -->
        <path d="M 256 100 C 240 100, 230 110, 230 120 C 210 120, 200 135, 210 150 C 205 160, 215 170, 230 170 C 235 180, 255 180, 260 170 C 275 170, 285 160, 280 150 C 290 135, 280 120, 260 120 C 260 110, 250 100, 256 100 Z" transform="translate(0, -20)"/>
        <!-- Popcorn 2 -->
        <path d="M 160 140 C 145 140, 135 150, 135 160 C 115 160, 105 175, 115 190 C 110 200, 120 210, 135 210 C 140 220, 160 220, 165 210 C 180 210, 190 200, 185 190 C 195 175, 185 160, 165 160 C 165 150, 155 140, 160 140 Z" transform="rotate(-15 160 180) scale(0.8) translate(30, -30)"/>
        <!-- Popcorn 3 -->
        <path d="M 370 150 C 355 150, 345 160, 345 170 C 325 170, 315 185, 325 200 C 320 210, 330 220, 345 220 C 350 230, 370 230, 375 220 C 390 220, 400 210, 395 200 C 405 185, 395 170, 375 170 C 375 160, 365 150, 370 150 Z" transform="rotate(20 370 190) scale(0.9) translate(-10, -20)"/>

        <!-- Main cluster bursting from top -->
        <!-- Center huge -->
        <circle cx="256" cy="180" r="45" />
        <circle cx="210" cy="190" r="40" />
        <circle cx="302" cy="190" r="40" />
        <!-- Edges -->
        <circle cx="170" cy="220" r="35" />
        <circle cx="342" cy="220" r="35" />
        <!-- Forward lumps -->
        <circle cx="230" cy="230" r="35" />
        <circle cx="282" cy="230" r="35" />
        <circle cx="256" cy="250" r="30" />
    </g>

    <!-- Highlight for Popcorn -->
    <g fill="#fffacd" opacity="0.6">
        <circle cx="245" cy="165" r="10" />
        <circle cx="195" cy="175" r="8" />
        <circle cx="315" cy="175" r="8" />
        <circle cx="220" cy="215" r="9" />
        <circle cx="270" cy="215" r="9" />
    </g>

    <!-- Clapperboard acting as the Popcorn Tub -->
    <g transform="translate(0, 10)">
        <!-- Tub base -->
        <!-- We use an inverted trapezoid -->
        <path d="M150 250 L362 250 L330 460 L182 460 Z" fill="#0a0a0f" stroke="#1a73e8" stroke-width="12" stroke-linejoin="round"/>
        <!-- Vertical stripes on the tub -->
        <path d="M190 260 L205 450 M256 260 L256 450 M322 260 L307 450" stroke="#12121a" stroke-width="15" stroke-linecap="round"/>
        
        <!-- Hinged upper stick of the clapperboard -->
        <!-- Pivots around (150, 235) -->
        <g transform="translate(150, 235) rotate(-22)">
            <!-- Stick base -->
            <rect x="0" y="-15" width="212" height="30" rx="8" fill="#1a73e8"/>
            <!-- White/LightBlue angled stripes -->
            <path d="M 30 -15 L 15 15 M 75 -15 L 60 15 M 120 -15 L 105 15 M 165 -15 L 150 15 M 210 -15 L 195 15" stroke="#e8eaed" stroke-width="16" stroke-linecap="square"/>
        </g>
        
        <!-- Horizontal lower stick of the clapperboard (acting as the tub rim) -->
        <g transform="translate(150, 235)">
            <rect x="0" y="-15" width="212" height="30" rx="8" fill="#1a73e8" stroke="#0a0a0f" stroke-width="4"/>
            <!-- White/LightBlue angled stripes -->
            <path d="M 30 -15 L 15 15 M 75 -15 L 60 15 M 120 -15 L 105 15 M 165 -15 L 150 15 M 210 -15 L 195 15" stroke="#e8eaed" stroke-width="16" stroke-linecap="square"/>
        </g>

        <!-- Hinge joint -->
        <circle cx="165" cy="235" r="8" fill="#e8eaed" stroke="#0a0a0f" stroke-width="3"/>
    </g>
</svg>
